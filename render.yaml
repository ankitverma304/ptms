# ── Server ──────────────────────────────────────
NODE_ENV=development
PORT=5000

# ── MySQL (Railway) ──────────────────────────────
# Copy these values from Railway dashboard:
# Project → MySQL service → Variables tab
# Railway variable name  →  used here as
# MYSQLHOST              →  DB_HOST
# MYSQLPORT              →  DB_PORT
# MYSQLUSER              →  DB_USER
# MYSQLPASSWORD          →  DB_PASSWORD
# MYSQLDATABASE          →  DB_NAME
DB_HOST=mysql.railway.internal
DB_PORT=3306
DB_USER=root
DB_PASSWORD=
DB_NAME=ptms_db

# ── JWT ──────────────────────────────────────────
JWT_SECRET=ptms_jwt_secret_64chars_abcdefghijklmnopqrstuvwxyz1234567890xyzab
JWT_EXPIRES_IN=15m
REFRESH_TOKEN_SECRET=ptms_refresh_secret_64chars_abcdefghijklmnopqrstuvwxyz1234567890xy
REFRESH_TOKEN_EXPIRES_IN=7d

# ── File Uploads ─────────────────────────────────
UPLOAD_PATH=./uploads
MAX_FILE_SIZE_MB=50

# ── Email (Nodemailer) ───────────────────────────
SMTP_HOST=smtp.gmail.com
SMTP_PORT=587
SMTP_USER=noreply@yourcompany.com
SMTP_PASS=your_app_password
EMAIL_FROM="PTMS System <noreply@yourcompany.com>"

# ── Frontend URL (CORS) ──────────────────────────
CLIENT_URL=http://localhost:3000
