services:
  - type: web
    name: ptms
    runtime: node
    plan: free
    branch: main

    # Build
    buildCommand: npm install --omit=dev

    # Start
    startCommand: npm start

    healthCheckPath: /health
    autoDeploy: true

    envVars:
      # Environment
      - key: NODE_ENV
        value: production

      # JWT Secrets
      - key: JWT_SECRET
        generateValue: true

      - key: JWT_EXPIRES_IN
        value: 15m

      - key: REFRESH_TOKEN_SECRET
        generateValue: true

      - key: REFRESH_TOKEN_EXPIRES_IN
        value: 7d

      # Frontend URL (replace with actual frontend URL)
      - key: CLIENT_URL
        value: https://your-frontend.vercel.app

      # Railway MySQL
      # Fill manually in Render Dashboard → Environment
      - key: DB_HOST
        sync: false

      - key: DB_PORT
        value: "3306"

      - key: DB_USER
        sync: false

      - key: DB_PASSWORD
        sync: false

      - key: DB_NAME
        sync: false

      # Optional SSL flag
      - key: DB_SSL
        value: "true"

      # Uploads
      - key: UPLOAD_PATH
        value: ./uploads

      - key: MAX_FILE_SIZE_MB
        value: "50"

      # Email
      - key: SMTP_HOST
        sync: false

      - key: SMTP_PORT
        value: "587"

      - key: SMTP_USER
        sync: false

      - key: SMTP_PASS
        sync: false
