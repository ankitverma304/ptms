project:
  name: PTMS
  full_name: Project and Ticket Management System
  type: full-stack
  stack:
    backend: Node.js + Express + Socket.IO
    frontend: React
    database: MySQL

render_readiness:
  status: documentation_ready
  note: >
    This file documents a Render-ready deployment plan for the current project
    without changing application code.

services:
  backend:
    service_type: web
    root_dir: backend
    runtime: node
    build_command: npm install
    start_command: npm start
    health_check_path: /health
    default_port: 5000
    required_env:
      - PORT
      - NODE_ENV
      - CLIENT_URL
      - DB_HOST
      - DB_PORT
      - DB_USER
      - DB_PASSWORD
      - DB_NAME
      - JWT_SECRET
      - JWT_EXPIRES_IN
    recommended_env:
      NODE_ENV: production
      JWT_EXPIRES_IN: 1h

  frontend:
    service_type: static
    root_dir: frontend
    runtime: node
    build_command: npm install && npm run build
    publish_dir: build
    note: >
      The frontend currently uses relative API calls to /api/v1 and a local
      development proxy in package.json. For production on Render, it works best
      when the API is exposed on the same origin path or when the frontend is
      updated later to use an explicit API base URL.

database:
  provider: render_mysql_or_external_mysql
  schema_file: database/schema.sql
  connection_fields:
    - DB_HOST
    - DB_PORT
    - DB_USER
    - DB_PASSWORD
    - DB_NAME

deploy_order:
  - Provision MySQL and load database/schema.sql
  - Create backend web service from backend/
  - Set backend environment variables
  - Create frontend static site from frontend/
  - Point CLIENT_URL to the deployed frontend URL
  - Verify backend /health endpoint

render_dashboard_setup:
  backend:
    name: ptms-backend
    root_dir: backend
    build_command: npm install
    start_command: npm start
    health_check_path: /health

  frontend:
    name: ptms-frontend
    root_dir: frontend
    build_command: npm install && npm run build
    publish_dir: build

environment_template:
  backend:
    NODE_ENV: production
    PORT: 10000
    CLIENT_URL: https://your-frontend.onrender.com
    DB_HOST: your-mysql-host
    DB_PORT: 3306
    DB_USER: your-mysql-user
    DB_PASSWORD: your-mysql-password
    DB_NAME: ptms_db
    JWT_SECRET: replace-with-strong-secret
    JWT_EXPIRES_IN: 1h

checks:
  backend:
    - GET /health returns status ok
    - CORS origin matches deployed frontend URL
    - Database accepts remote connection from Render
  frontend:
    - Static build completes successfully
    - API requests reach backend
    - Socket connections use the deployed backend origin

constraints:
  - >
    No source code changes were made.
  - >
    The frontend is not fully production-configurable from documentation alone
    because API requests are hardcoded as relative /api/v1 paths.
  - >
    If you want a true one-click Render Blueprint later, the file Render expects
    is render.yaml, not readme.yml.
